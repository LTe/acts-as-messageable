name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '02 4 * * *'

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run : bundle exec rake rubocop
  rbi-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run : bundle exec tapioca gem --verify
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run : bundle exec srb
  test:
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    runs-on: ubuntu-24.04
    # Rails main is an early warning for the next release.
    continue-on-error: ${{ matrix.gemfile == 'gemfiles/rails_master.gemfile' }}
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
      RUN_GENERATORS: ${{ matrix.run_generators || 'false' }}
      PGPASSWORD: password
      DATABASE_ADAPTER: sqlite3
      DATABASE_NAME: ":memory:"
      DATABASE_PASSWORD: password
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.3'
            rails: '7.2'
            gemfile: gemfiles/rails_7.2.gemfile
            run_generators: 'true'
          - ruby: '3.4'
            rails: '8.1'
            gemfile: Gemfile
          - ruby: '4.0'
            rails: '8.1'
            gemfile: Gemfile
          - ruby: '4.0'
            rails: main
            gemfile: gemfiles/rails_master.gemfile
          - ruby: ruby-head
            rails: main
            gemfile: gemfiles/rails_master.gemfile
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install libyaml-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: default
          bundler-cache: true
      - run: psql -c 'create database ci_test;' -U postgres -h localhost
      - run: bundle exec rake
      - name: Report Rails main incompatibility
        if: ${{ failure() && matrix.gemfile == 'gemfiles/rails_master.gemfile' }}
        run: |
          echo "::warning::Rails main compatibility checks failed; investigate before the next Rails release."
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Rails main compatibility

          This experimental check failed. It does not block the build, but indicates
          a compatibility issue to investigate before the next Rails release.
          See the failed steps above for details.
          EOF
  readme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: 'bundle exec rake readme'
  documentation:
    runs-on: ubuntu-24.04
    needs: ['test', 'static']
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: 'bundle exec yard doc --private'
      - uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          branch: gh-pages
          folder: doc
